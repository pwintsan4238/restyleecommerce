<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .font-label-caps { font-family: 'Plus Jakarta Sans'; font-size: 12px; line-height: 1.0; letter-spacing: 0.15em; font-weight: 600; }
        .text-label-caps { font-size: 12px; line-height: 1.0; letter-spacing: 0.15em; font-weight: 600; }
        
        .glass-card {
            background: rgba(239, 236, 230, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .product-hover-action {
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .product-card:hover .product-hover-action {
            opacity: 1;
            transform: translateY(0);
        }

        .product-card:hover .product-image {
            transform: scale(1.05);
        }

        .staggered-grid > div:nth-child(even) {
            margin-top: 0;
        }

        @media (min-width: 1024px) {
            .staggered-grid > div:nth-child(even) {
                margin-top: 3rem;
            }
        }
    </style>
